# Cleo ISA, machine-readable. Single source for sw/gen_isa.py (assembler, ISS, src/jspe_isa.vh).
# Prose and semantics: ISA.md. Host constants: HOSTIF.md. Bit ranges are [msb, lsb].
version: 1
word_bits: 16
addr_bits: 9
mem_words: 512
engines: 4

enums:
  guard:
    always: 0
    tick: 1
    tock: 2
    hrx: 3
    htx: 4
    c0: 5
    c1: 6
    never: 7
    rise_p0: 8
    rise_p1: 9
    rise_p2: 10
    rise_p3: 11
    fall_p0: 12
    fall_p1: 13
    fall_p2: 14
    fall_p3: 15
  reg: {R0: 0, R1: 1, R2: 2, S: 3, P: 4, C: 5, T: 6, L: 7}
  reg2: {R0: 0, R1: 1, R2: 2, S: 3}
  act_a: {none: 0, drive0: 1, drive1: 2, z: 3, d: 4, out: 5, q: 6, f: 7}
  act_b: {none: 0, drive0: 1, drive1: 2, t: 3}
  loop: {none: 0, rep: 1, head: 2, tail: 3}
  cond_src: {'true': 0, z: 1, cy: 2, b: 3, par: 4, run: 5, w: 6, hrx: 7, htx: 8, c0: 9, c1: 10, ovr: 11, mis: 12}
  alu: {add: 0, adc: 1, sub: 2, cmp: 4, and: 5, or: 6, xor: 7, tst: 8, shl: 9, shr: 10, rlc: 11, rrc: 12}   # 3, 13, 14, 15 undefined (D048)
  imm_op: {li: 0, lih: 1, add: 2, cmp: 3}
  mem_mode: {base: 0, pre1_wb: 1, idx_s: 2, idx_s_wb: 3}
  cc_sel:
    lvl_p0: 0
    lvl_p1: 1
    lvl_p2: 2
    lvl_p3: 3
    rise_p0: 4
    rise_p1: 5
    rise_p2: 6
    rise_p3: 7
    fall_p0: 8
    fall_p1: 9
    fall_p2: 10
    fall_p3: 11
    tick: 12
    tock: 13
    mis: 14
    hrx: 15
  cc_mode: {off: 0, abort: 1, call: 2}
  alt: {par: 0, ndata: 1, stuff: 2, b: 3}
  timer_pre: {div1: 0, div16: 1, div256: 2}
  sync_edge: {none: 0, rise: 1, fall: 2, both: 3}
  bind_src:
    ui0: 0
    ui1: 1
    ui2: 2
    ui3: 3
    ui4: 4
    ui5: 5
    ui6: 6
    ui7: 7
    uio0: 8
    uio1: 9
    uio2: 10
    uio3: 11
    uio4: 12
    uio5: 13
    uio6: 14
    uio7: 15
    g0: 16
    g1: 17
    g2: 18
    g3: 19
    g4: 20
    g5: 21
    g6: 22
    g7: 23
    zero: 24
    one: 25

formats:
  E:  {mask: 0x8000, value: 0x0000, guarded: true}
  JP: {mask: 0xC000, value: 0x8000, guarded: true}
  JF: {mask: 0xF000, value: 0xC000, guarded: false}
  GM: {mask: 0xF000, value: 0xD000, guarded: true}
  IM: {mask: 0xF000, value: 0xE000, guarded: false}
  RX: {mask: 0xF000, value: 0xF000, guarded: false}

# clocks: fire-to-completion; "mem" = one memory slot (ld 2-5, st 1-4 with the default slot map).
# operand kinds: reg, reg2, pin, imm8, simm8, uimm (width from the field), rel7, addr9, creg, guard is implicit field g.
# flags: stored condition flags the instruction can change (z, cy, b, par, run, w = bit counter N, ovr).
instructions:
  - name: pin
    format: E
    mask: 0x8000
    value: 0x0000
    fields: {pa: [14, 13], aa: [12, 10], pb: [9, 9], ab: [8, 7], s: [6, 6], rr: [5, 4], g: [3, 0]}
    clocks: 1
    flags: [b, par, run, w]
    doc: "pin/shift instant: action A (any pin), action B (p0/p1), optional shin, loop field"
  - {name: jlo, format: JP, mask: 0xE000, value: 0x8000, fields: {pin: [12, 11], rel: [10, 4], g: [3, 0]}, operands: [{field: pin, kind: pin}, {field: rel, kind: rel7}], clocks: 1, flags: [], doc: "jump if pin level is 0"}
  - {name: jhi, format: JP, mask: 0xE000, value: 0xA000, fields: {pin: [12, 11], rel: [10, 4], g: [3, 0]}, operands: [{field: pin, kind: pin}, {field: rel, kind: rel7}], clocks: 1, flags: [], doc: "jump if pin level is 1"}

  - {name: jmp,   format: JF, mask: 0xFF80, value: 0xC000, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], fold: true, doc: "unconditional, folded by the prefetcher"}
  - {name: jz,    format: JF, mask: 0xFF80, value: 0xC100, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "Z"}
  - {name: jnz,   format: JF, mask: 0xFF80, value: 0xC180, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not Z"}
  - {name: jc,    format: JF, mask: 0xFF80, value: 0xC200, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "CY"}
  - {name: jnc,   format: JF, mask: 0xFF80, value: 0xC280, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not CY"}
  - {name: jb,    format: JF, mask: 0xFF80, value: 0xC300, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "B"}
  - {name: jnb,   format: JF, mask: 0xFF80, value: 0xC380, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not B"}
  - {name: jpar,  format: JF, mask: 0xFF80, value: 0xC400, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "PAR"}
  - {name: jnpar, format: JF, mask: 0xFF80, value: 0xC480, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not PAR"}
  - {name: jrun,  format: JF, mask: 0xFF80, value: 0xC500, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "run limit reached"}
  - {name: jnrun, format: JF, mask: 0xFF80, value: 0xC580, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "run limit not reached"}
  - {name: jw,    format: JF, mask: 0xFF80, value: 0xC600, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "inside a word (N != 0)"}
  - {name: jnw,   format: JF, mask: 0xFF80, value: 0xC680, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "at a word boundary (N == 0)"}
  - {name: jrx,   format: JF, mask: 0xFF80, value: 0xC700, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "host byte available"}
  - {name: jnrx,  format: JF, mask: 0xFF80, value: 0xC780, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "RX FIFO empty"}
  - {name: jtx,   format: JF, mask: 0xFF80, value: 0xC800, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "TX FIFO has room"}
  - {name: jntx,  format: JF, mask: 0xFF80, value: 0xC880, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "TX FIFO full"}
  - {name: jc0,   format: JF, mask: 0xFF80, value: 0xC900, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "condition cell 0"}
  - {name: jnc0,  format: JF, mask: 0xFF80, value: 0xC980, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not condition cell 0"}
  - {name: jc1,   format: JF, mask: 0xFF80, value: 0xCA00, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "condition cell 1"}
  - {name: jnc1,  format: JF, mask: 0xFF80, value: 0xCA80, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not condition cell 1"}
  - {name: jovr,  format: JF, mask: 0xFF80, value: 0xCB00, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "OVR"}
  - {name: jnovr, format: JF, mask: 0xFF80, value: 0xCB80, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not OVR"}
  - {name: jmis,  format: JF, mask: 0xFF80, value: 0xCC00, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "MIS"}
  - {name: jnmis, format: JF, mask: 0xFF80, value: 0xCC80, fields: {rel: [6, 0]}, operands: [{field: rel, kind: rel7}], clocks: 1, flags: [], doc: "not MIS"}

  - {name: mov,   format: GM, mask: 0xFC00, value: 0xD000, fields: {rd: [9, 7], rs: [6, 4], g: [3, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [], doc: "rd <- rs; rs = T captures the timer"}
  - {name: push,  format: GM, mask: 0xFF80, value: 0xD400, fields: {rs: [6, 4], g: [3, 0]}, operands: [{field: rs, kind: reg}], clocks: 1, flags: [ovr], doc: "TX FIFO <- rs[7:0]"}
  - {name: pushh, format: GM, mask: 0xFF80, value: 0xD480, fields: {rs: [6, 4], g: [3, 0]}, operands: [{field: rs, kind: reg}], clocks: 1, flags: [ovr], doc: "TX FIFO <- rs[15:8]"}
  - {name: pull,  format: GM, mask: 0xFF80, value: 0xD500, fields: {rd: [6, 4], g: [3, 0]}, operands: [{field: rd, kind: reg}], clocks: 1, flags: [ovr], doc: "rd <- zext(RX FIFO byte)"}
  - {name: pullh, format: GM, mask: 0xFF80, value: 0xD580, fields: {rd: [6, 4], g: [3, 0]}, operands: [{field: rd, kind: reg}], clocks: 1, flags: [ovr], doc: "rd[15:8] <- RX FIFO byte"}
  - {name: tsync, format: GM, mask: 0xFFF0, value: 0xD800, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [], doc: "timer start, periodic, T <- P"}
  - {name: tstop, format: GM, mask: 0xFFF0, value: 0xD810, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [], doc: "timer stop"}
  - {name: smp,   format: GM, mask: 0xFFF0, value: 0xD820, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [b, run, par], doc: "sample input pin to B and PAR without shifting"}
  - {name: wrst,  format: GM, mask: 0xFFF0, value: 0xD830, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [par, run, w], doc: "N <- 0, PAR <- podd, RUN <- 0"}
  - {name: ovclr, format: GM, mask: 0xFFF0, value: 0xD840, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [ovr], doc: "OVR <- 0"}
  - {name: ret,   format: GM, mask: 0xFFF0, value: 0xD850, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [], doc: "PC <- L"}
  - {name: halt,  format: GM, mask: 0xFFF0, value: 0xD860, fields: {g: [3, 0]}, operands: [], clocks: 1, flags: [], doc: "stop the engine, notify the host"}
  - {name: tset,  format: GM, mask: 0xFF80, value: 0xD880, fields: {rs: [6, 4], g: [3, 0]}, operands: [{field: rs, kind: reg}], clocks: 1, flags: [], doc: "timer start, one-shot, T <- rs"}
  - {name: sset,  format: GM, mask: 0xFF80, value: 0xD900, fields: {n: [6, 4], g: [3, 0]}, operands: [{field: n, kind: uimm}], clocks: 1, flags: [], doc: "signal flag n <- 1"}
  - {name: sclr,  format: GM, mask: 0xFF80, value: 0xD980, fields: {n: [6, 4], g: [3, 0]}, operands: [{field: n, kind: uimm}], clocks: 1, flags: [], doc: "signal flag n <- 0"}
  - {name: watch, format: GM, mask: 0xFFC0, value: 0xDA80, fields: {m: [5, 4], g: [3, 0]}, operands: [{field: m, kind: uimm}], clocks: 1, flags: [], doc: "watcher enables <- m"}
  - {name: evt,   format: GM, mask: 0xFC00, value: 0xDC00, fields: {c: [9, 4], g: [3, 0]}, operands: [{field: c, kind: uimm}], clocks: 1, flags: [ovr], doc: "event code c to the host stream"}

  - {name: li,    format: IM, mask: 0xFC00, value: 0xE000, fields: {rd: [9, 8], imm: [7, 0]}, operands: [{field: rd, kind: reg2}, {field: imm, kind: imm8}], clocks: 1, flags: [], doc: "rd <- zext(imm8)"}
  - {name: lih,   format: IM, mask: 0xFC00, value: 0xE400, fields: {rd: [9, 8], imm: [7, 0]}, operands: [{field: rd, kind: reg2}, {field: imm, kind: imm8}], clocks: 1, flags: [], doc: "rd[15:8] <- imm8"}
  - {name: addi,  format: IM, mask: 0xFC00, value: 0xE800, fields: {rd: [9, 8], imm: [7, 0]}, operands: [{field: rd, kind: reg2}, {field: imm, kind: simm8}], clocks: 1, flags: [z, cy], syntax: add, doc: "rd <- rd + sext(imm8)"}
  - {name: cmpi,  format: IM, mask: 0xFC00, value: 0xEC00, fields: {rd: [9, 8], imm: [7, 0]}, operands: [{field: rd, kind: reg2}, {field: imm, kind: imm8}], clocks: 1, flags: [z, cy], syntax: cmp, doc: "flags of rd - zext(imm8)"}

  - {name: add,   format: RX, mask: 0xFFC0, value: 0xF000, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- rd + rs"}
  - {name: adc,   format: RX, mask: 0xFFC0, value: 0xF040, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- rd + rs + CY"}
  - {name: sub,   format: RX, mask: 0xFFC0, value: 0xF080, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- rd - rs"}
  - {name: cmp,   format: RX, mask: 0xFFC0, value: 0xF100, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "flags of rd - rs"}
  - {name: and,   format: RX, mask: 0xFFC0, value: 0xF140, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z], doc: "rd <- rd & rs"}
  - {name: or,    format: RX, mask: 0xFFC0, value: 0xF180, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z], doc: "rd <- rd | rs"}
  - {name: xor,   format: RX, mask: 0xFFC0, value: 0xF1C0, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z], doc: "rd <- rd ^ rs"}
  - {name: tst,   format: RX, mask: 0xFFC0, value: 0xF200, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z], doc: "flags of rd & rs"}
  - {name: shl,   format: RX, mask: 0xFFC0, value: 0xF240, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- rs << 1"}
  - {name: shr,   format: RX, mask: 0xFFC0, value: 0xF280, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- rs >> 1"}
  - {name: rlc,   format: RX, mask: 0xFFC0, value: 0xF2C0, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- (rs << 1) | CY"}
  - {name: rrc,   format: RX, mask: 0xFFC0, value: 0xF300, fields: {rd: [5, 3], rs: [2, 0]}, operands: [{field: rd, kind: reg}, {field: rs, kind: reg}], clocks: 1, flags: [z, cy], doc: "rd <- (CY << 15) | (rs >> 1)"}
  - {name: jmpa,  format: RX, mask: 0xFE00, value: 0xF400, fields: {addr: [8, 0]}, operands: [{field: addr, kind: addr9}], clocks: 1, flags: [], fold: true, syntax: jmp, doc: "absolute jump, folded by the prefetcher"}
  - {name: call,  format: RX, mask: 0xFE00, value: 0xF600, fields: {addr: [8, 0]}, operands: [{field: addr, kind: addr9}], clocks: 1, flags: [], doc: "L <- PC + 1; PC <- addr"}
  - {name: ld,    format: RX, mask: 0xFF01, value: 0xF800, fields: {rd: [7, 5], rb: [4, 3], mode: [2, 1]}, operands: [{field: rd, kind: reg}, {field: rb, kind: reg2}, {field: mode, kind: mem_mode}], clocks: mem, flags: [], doc: "rd <- mem[address]"}
  - {name: st,    format: RX, mask: 0xFF01, value: 0xF900, fields: {rs: [7, 5], rb: [4, 3], mode: [2, 1]}, operands: [{field: rs, kind: reg}, {field: rb, kind: reg2}, {field: mode, kind: mem_mode}], clocks: mem, flags: [], doc: "mem[address] <- rs"}
  - {name: wcfg,  format: RX, mask: 0xFF00, value: 0xFA00, fields: {creg: [7, 3], rs: [2, 0]}, operands: [{field: creg, kind: creg}, {field: rs, kind: reg}], clocks: 1, flags: [par, run, w], doc: "configuration register <- rs (flags: SHCFG write only, it performs wrst)"}
  - {name: rcfg,  format: RX, mask: 0xFF00, value: 0xFB00, fields: {creg: [7, 3], rd: [2, 0]}, operands: [{field: rd, kind: reg}, {field: creg, kind: creg}], clocks: 1, flags: [], doc: "rd <- configuration register"}

# Words that match an instruction above but are undefined (trap). A word is undefined if it matches
# no instruction or one of these entries.
undefined:
  - {mask: 0xFFF8, value: 0xFAA8, doc: "wcfg SIG: the signal flags are read-only for the engines (D048)"}

# Configuration registers (wcfg/rcfg). scope: engine (one per engine) or shared. writable defaults to true.
cregs:
  - name: SHCFG
    index: 0
    scope: engine
    reset: 0x0007
    readable: false
    fields: {wl: [3, 0], lsb: [4, 4], inpin: [6, 5], inv: [7, 7], diff: [8, 8], apush: [9, 9], apull: [10, 10]}
  - name: TAPCFG
    index: 1
    scope: engine
    reset: 0
    readable: false
    fields: {alt: [1, 0], podd: [2, 2], lfen: [3, 3], rl: [6, 4], r1: [7, 7]}
  - name: TCFG
    index: 2
    scope: engine
    reset: 0
    readable: false
    fields: {frac: [7, 0], pre: [9, 8], sedge: [11, 10], spin: [13, 12], swin: [14, 14]}
  - name: BIND01
    index: 3
    scope: engine
    reset: 0
    readable: false
    fields: {p0_src: [4, 0], p0_inv: [5, 5], p1_src: [12, 8], p1_inv: [13, 13]}
  - name: BIND23
    index: 4
    scope: engine
    reset: 0
    readable: false
    fields: {p2_src: [4, 0], p2_inv: [5, 5], p3_src: [12, 8], p3_inv: [13, 13]}
  - name: CC0
    index: 5
    scope: engine
    reset: 0
    readable: false
    fields: {sel_a: [3, 0], sel_b: [7, 4], lut: [11, 8], mode: [13, 12]}
  - name: CC1
    index: 6
    scope: engine
    reset: 0
    readable: false
    fields: {sel_a: [3, 0], sel_b: [7, 4], lut: [11, 8], mode: [13, 12]}
  - name: WV0
    index: 7
    scope: engine
    reset: 0
    readable: false
    fields: {vec: [8, 0]}
  - name: WV1
    index: 8
    scope: engine
    reset: 0
    readable: false
    fields: {vec: [8, 0]}
  - name: LFSR_LO
    index: 16
    scope: shared
    reset: null
    readable: true
    fields: {v: [15, 0]}
  - name: LFSR_HI
    index: 17
    scope: shared
    reset: null
    readable: true
    fields: {v: [15, 0]}
  - name: POLY_LO
    index: 18
    scope: shared
    reset: null
    readable: false
    fields: {v: [15, 0]}
  - name: POLY_HI
    index: 19
    scope: shared
    reset: null
    readable: false
    fields: {v: [15, 0]}
  - name: LFCFG
    index: 20
    scope: shared
    reset: 0
    readable: false
    fields: {right: [0, 0]}
  - name: SIG
    index: 21
    scope: shared
    reset: 0
    readable: true
    writable: false
    fields: {g: [7, 0]}

# Host link constants (HOSTIF.md).
host:
  esc: 0x1B
  bit_clk: [16, 8, 4]
  h2c:                # byte after ESC, host -> chip
    literal: 0x1B
    sel: 0x00         # | engine (0-3)
    stop: 0x20        # | mask
    run: 0x30         # | mask
    step: 0x40        # | mask
    rst: 0x50         # | mask
    exec: 0x60        # | engine, then word lo, hi
    wrmem: 0x70       # addr lo, addr hi, n-1, n words (lo, hi)
    rdmem: 0x71       # addr lo, addr hi, n-1
    wrreg: 0x72       # reg, lo, hi
    rdreg: 0x73       # reg
    sync: 0x74
  c2h:                # byte after ESC, chip -> host
    literal: 0x1B
    stream: 0x00      # | engine
    event: 0x40       # | code (0-63), from the engine of the current stream
    ovr: 0x80         # | engine
    halted: 0x84      # | engine
    trap: 0x88        # | engine
    linkerr: 0x8C
    rdmem: 0xC1       # then 2n bytes
    rdreg: 0xC3       # then lo, hi
    sync: 0xC4        # then ID lo, hi
  regs:
    ID:      {addr: 0x00, access: r,  reset: 0x4A10}
    LINK:    {addr: 0x01, access: rw, reset: 0, fields: {rate: [1, 0]}}
    SLOTMAP: {addr: 0x02, access: rw, reset: 0xE4, fields: {s0: [1, 0], s1: [3, 2], s2: [5, 4], s3: [7, 6]}}
    SIG:     {addr: 0x03, access: rw, reset: 0, fields: {g: [7, 0]}}
    FILT:    {addr: 0x04, access: w,  reset: 0, fields: {ui: [7, 0], uio: [15, 8]}}
    PINS:    {addr: 0x05, access: r,  fields: {ui: [7, 0], uio: [15, 8]}}
    ECLR:    {addr: 0x06, access: w,  fields: {ovr: [3, 0], stopflags: [7, 4]}}
    EST0:    {addr: 0x08, access: r}
    EST1:    {addr: 0x09, access: r}
    EST2:    {addr: 0x0A, access: r}
    EST3:    {addr: 0x0B, access: r}
    PAD_UO:  {addr: 0x10, count: 8, access: w, reset: 0}
    PAD_UIO: {addr: 0x18, count: 8, access: w, reset: 0}
  est_fields: {pc: [8, 0], run: [9, 9], wait: [10, 10], ovr: [11, 11], trap: [12, 12], halted: [13, 13], rx_ne: [14, 14], tx_ne: [15, 15]}
  pad_fields: {lp: [1, 0], eng: [3, 2], inv: [4, 4], od: [5, 5], en: [6, 6]}
  image:              # load image record types (.bin)
    mem: 0x01
    reg: 0x02
    exec: 0x03
    run: 0x04
    rst: 0x05
